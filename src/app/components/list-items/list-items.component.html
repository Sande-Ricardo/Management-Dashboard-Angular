    <!-- Hace falta agregar efecto fade como principio del bloque -->

        19.171875 2 z M 14.5 5.5 L 3 17 L 3 21 L 7 21 L 18.5 9.5 L 14.5 5.5 z"></path>
    </svg>
    <svg class="edit" (click)="changeEdit()" *ngIf="edit" x="0px" y="0px" width="26" height="26" viewBox="0 0 26 26">
            <path d="M 22.566406 4.730469 L 20.773438 3.511719 C 20.277344 3.175781 19.597656 3.304688 19.265625 3.796875

            10.476563 22.613281 10.96875 22.613281 C 11.460938 22.613281 11.957031 22.304688 12.277344 21.839844 L
            22.855469 6.234375 C 23.191406 5.742188 23.0625 5.066406 22.566406 4.730469 Z"></path>
        </svg>
    <span class="editPanel" [ngClass]="{'editPanelActive':edit, 'editPanelInactive':!edit}" >
        <svg class="del" x="0px" y="0px" width="24" height="24" viewBox="0 0 24 24">
            <path d="M 10.806641 2 C 10.289641 2 9.7956875 2.2043125 9.4296875 2.5703125 L 9 3 L 4 3 A 1.0001
            1.0001 0 1 0 4 5 L 20 5 A 1.0001 1.0001 0 1 0 20 3 L 15 3 L 14.570312 2.5703125 C 14.205312 2.2043125
            13.710359 2 13.193359 2 L 10.806641 2 z M 4.3652344 7 L 5.8925781 20.263672 C 6.0245781 21.253672 6.877
            22 7.875 22 L 16.123047 22 C 17.121047 22 17.974422 21.254859 18.107422 20.255859 L 19.634766 7 L 4.3652344
            7 z"></path>
        </svg>
    </span>

    <div class="headline" *ngIf="edit" (dblclick)="changeEdit()">
        <!-- <input [(ngModel)]="headlines[sharingSv.headlineIndex].content" (blur)="updateUser(true)" /> -->
        <textarea [(ngModel)]="headlines[sharingSv.headlineIndex].content" (blur)="updateUser(true)" ></textarea>
    </div>

    <div class="headline" *ngIf="!edit" (dblclick)="changeEdit()">
        <p>{{ headlines[sharingSv.headlineIndex].content }}</p>
    </div>

    <div class="items">
        <!-- agregar inputs binding-->
        <div class="task" *ngFor="
            let task of (user$ | async)!.headlines[sharingSv.headlineIndex].tasks;
            let i = index
        ">
            <textarea class="input" [(ngModel)]="task.title" (blur)="updateUser()"></textarea>
            <span class="trace"></span>
        </div>
    </div>
    <div class="addItem">
        <span class="line"> </span>
        <div class="cover" (click)="addTask()"></div>
        <!-- <span class="cover" (click)="addItem()"></span> -->
    </div>
    <!-- Para agregar efecto fade al final del bloque -->
    <span class="fade"></span>
    <!-- <p (click)="test1()">localStorage</p> -->
</div>
